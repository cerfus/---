# Запуск на VPS:
#   cd chat_coach && cp .env.example .env && nano .env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f

services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    # Бот должен подниматься сам после перезагрузки сервера и после падения:
    # напоминания и разборы не ждут, пока кто-то заметит, что он лежит.
    restart: unless-stopped
    volumes:
      - data:/data
    # Без потолка логи растут, пока не кончится диск, — а кончится он
    # в самый неудобный момент.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
